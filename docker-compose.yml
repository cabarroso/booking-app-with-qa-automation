
services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    depends_on:
      - db
    environment:
      - DATABASE_URL=postgresql://user:password@db:5432/bookings

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=http://backend:8000

  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: bookings
    ports:
      - "5432:5432"

  tests:
    build:
      context: .
      dockerfile: tests/Dockerfile
    depends_on:
      - backend
    environment:
      - API_BASE_URL=http://backend:8000
      - UI_BASE_URL=http://frontend:5173
    